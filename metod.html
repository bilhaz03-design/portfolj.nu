<script>
/* Rörelsen (wow.js): introt spelas första gången sidan öppnas i en webbläsare, inte vid omladdning och inte i en ny flik
   (2026-10-06). Minnet sätts samtidigt som klassen, före första målningen, så att en omladdning mitt i introt inte heller
   spelar om det; / och /index.html är samma sida. Minska rörelse stänger av introt; ?spela=1 spelar det ändå och ?spela=0
   stänger av det. Efter fyra sekunder tas klassen bort, också om wow.js aldrig körs. */
(function () { try { var q = new URLSearchParams(location.search), s = q.get('spela'), rm = matchMedia('(prefers-reduced-motion: reduce)').matches, k = 'wow.intro.' + location.pathname.replace(/\/index\.html$/, '/'); if (s === '1' || (!rm && s !== '0' && !localStorage.getItem(k))) { localStorage.setItem(k, '1'); document.documentElement.classList.add('wow-intro'); setTimeout(function () { document.documentElement.classList.remove('wow-intro'); }, 4000); } } catch (e) {} })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metoden · Portföljen</title>
<meta name="description" content="Om Portföljen: syftet, jämförelsen mot MSCI World, riktkurserna ur optionspriser och vad sidan inte visar.">
<script>
/* Färgläget sätts före första målningen, så att mörkt läge inte blinkar vitt. Samma ordning som tidning.js.
   Sajten och konceptets publikläge: bara kvällsupplagan, ljust som förval, mörkt om ?tema=mork eller det sparade
   valet säger det. Konceptets egen vy: upplagan ur adressen, det sparade valet eller systemet, och ljuset följer den. */
(function () {
  var PUBLIK = true;  /* bygg-publik.py sätter true på sajten */
  var d = document.documentElement, q = null;
  try { q = new URLSearchParams(location.search); } catch (e) {}
  if (PUBLIK || (q && q.get('publik') === '1')) {
    var t = q && q.get('tema');
    if (t !== 'ljus' && t !== 'mork') { try { t = localStorage.getItem('portfoljen.v2.tema'); } catch (e) { t = null; } }
    d.setAttribute('data-upplaga', 'kvall');
    d.setAttribute('data-tema', t === 'mork' ? 'mork' : 'ljus');
    return;
  }
  var u = q && q.get('upplaga');
  if (u !== 'morgon' && u !== 'kvall') { try { u = localStorage.getItem('portfoljen.v2.upplaga'); } catch (e) { u = null; } }
  if (u !== 'morgon' && u !== 'kvall') { try { u = matchMedia('(prefers-color-scheme: dark)').matches ? 'kvall' : 'morgon'; } catch (e) { u = 'morgon'; } }
  d.setAttribute('data-upplaga', u);
  d.setAttribute('data-tema', u === 'kvall' ? 'mork' : 'ljus');
})();
</script>

(function () {
  'use strict';
  const T = window.Tidning;
  if (!T) { document.querySelector('.sheet').insertAdjacentHTML('afterbegin', '<p style="padding:24px 0">Datan saknas: data.js kunde inte läsas.</p>'); return; }
  T.metod();
})();
</script>
