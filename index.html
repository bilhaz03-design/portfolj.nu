<!doctype html>
<html lang="sv" data-upplaga="morgon">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-3W2oFO+Z3+Vq3iYj3GHTtsPeJgh+QkTPZQp14yw2kBM=' 'sha256-QGBVy5JGhXgs/5g8xiaxCwbHFsLZkz5L8SoY+8sWM4Q='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portföljen</title>
<meta name="description" content="Portföljen: en tidning om fem positioner, skriven av maskinen 09:00 och 22:15 ur kurserna och ägarens egna positionskort.">
<script>
/* Upplagan sätts före första målningen, så att kvällsupplagan inte blinkar vit. Samma ordning som tidning.js:
   adressens ?upplaga, sedan det sparade valet, sedan systemets ljus eller mörker. */
(function () {
  var u = null;
  try { u = new URLSearchParams(location.search).get('upplaga'); } catch (e) {}
  if (u !== 'morgon' && u !== 'kvall') { try { u = localStorage.getItem('portfoljen.v2.upplaga'); } catch (e) { u = null; } }
  if (u !== 'morgon' && u !== 'kvall') { try { u = matchMedia('(prefers-color-scheme: dark)').matches ? 'kvall' : 'morgon'; } catch (e) { u = 'morgon'; } }
  document.documentElement.setAttribute('data-upplaga', u);
})();
</script>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tidning.css">
</head>
<body>
<div class="sheet">
  <div class="topbar"><span class="tag" id="tag"></span><div class="ctrls" id="ctrls"></div></div>
  <header class="masthead" aria-label="Tidningshuvud">
    <div class="ear left" id="ear-left"></div>
    <p class="nameplate">Portföljen</p>
    <div class="ear right" id="ear-right"></div>
  </header>
  <div class="rules" aria-hidden="true"></div>
  <section class="strip" id="strip" aria-label="Portföljen i siffror"></section>

  <section class="front" aria-label="Förstasidan">
    <article class="lead">
      <h1 id="headline"></h1>
      <p class="lede" id="lede"></p>
      <div class="byline" id="byline"></div>
      <figure class="graphic" style="margin-left:0;margin-right:0">
        <div class="ghead"><h2 id="g-ex-h"></h2></div>
        <p class="gsub" id="g-ex-sub"></p>
        <div class="chartwrap" id="excess"></div>
        <details class="numbers"><summary id="ex-sum"></summary><table class="t" id="ex-table"></table></details>
      </figure>
    </article>
    <aside class="rail" aria-label="Mot MSCI World">
      <figure class="graphic" style="margin-left:0;margin-right:0">
        <div class="ghead"><h2 id="g-gauge-h"></h2></div>
        <p class="gsub" id="g-gauge-sub"></p>
        <div class="chartwrap" id="gauge"></div>
        <div class="keys" id="gauge-keys"></div>
      </figure>
      <figure class="graphic" style="margin-left:0;margin-right:0">
        <div class="ghead"><h2 id="g-bars-h"></h2></div>
        <div class="chartwrap" id="bars"></div>
        <p class="gauge-note" id="g-bars-note"></p>
      </figure>
    </aside>
  </section>

  <section class="desk" id="desk" aria-label="Positionerna, ordnade efter vikt"></section>

  <section class="lower" aria-label="I korthet, kalendern och marknaderna">
    <section class="brief"><div class="head"><h2 id="brief-h"></h2><div class="lines" id="brief-lines"></div></div></section>
    <section class="calendar"><h2 id="cal-h"></h2><ul class="callist" id="cal"></ul></section>
    <section class="markets"><h2 id="mk-h"></h2><table class="t" id="macro"></table></section>
  </section>

  <section class="listwrap" aria-labelledby="list-h">
    <div class="listhead"><h2 id="list-h"></h2><p id="list-sub"></p></div>
    <table class="list" id="list"></table>
  </section>

  <footer class="foot" id="foot"></footer>
</div>
<noscript><p style="padding:24px 40px">Portföljen behöver JavaScript för att läsa datan i data.js. Portföljen needs JavaScript to read the data in data.js.</p></noscript>
<script src="data.js"></script>
<script src="tidning.js"></script>
<script>
(function () {
  'use strict';
  const T = window.Tidning;
  if (!T) { document.querySelector('.sheet').insertAdjacentHTML('afterbegin', '<p style="padding:24px 0">Datan saknas: data.js kunde inte läsas.</p>'); return; }
  T.forsta();
})();
</script>
</body>
</html>
