<!doctype html>
<html lang="sv" data-upplaga="morgon" data-tema="ljus">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-neoCaGeO1aSii89zy3sFMuAc7XErUhpYbgIM3xjgRKg=' 'sha256-yNNZuoKzsgXsuVcPRx/MwLX3IZPMnF91Gwi0AlOd+pw=' 'sha256-QGBVy5JGhXgs/5g8xiaxCwbHFsLZkz5L8SoY+8sWM4Q='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<script>
/* Rörelsen (wow.js): introt spelas första gången sidan öppnas i en webbläsare, inte vid omladdning och inte i en ny flik
   (2026-10-06). Minnet sätts samtidigt som klassen, före första målningen, så att en omladdning mitt i introt inte heller
   spelar om det; / och /index.html är samma sida. Minska rörelse stänger av introt; ?spela=1 spelar det ändå och ?spela=0
   stänger av det. Efter fyra sekunder tas klassen bort, också om wow.js aldrig körs. */
(function () { try { var q = new URLSearchParams(location.search), s = q.get('spela'), rm = matchMedia('(prefers-reduced-motion: reduce)').matches, k = 'wow.intro.' + location.pathname.replace(/\/index\.html$/, '/'); if (s === '1' || (!rm && s !== '0' && !localStorage.getItem(k))) { localStorage.setItem(k, '1'); document.documentElement.classList.add('wow-intro'); setTimeout(function () { document.documentElement.classList.remove('wow-intro'); }, 4000); } } catch (e) {} })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portföljen</title>
<meta name="description" content="Portföljen: ett öppet försök att slå världsindex MSCI World med fem positioner, skrivet av maskinen ur kurserna.">
<script>
/* Färgläget sätts före första målningen, så att mörkt läge inte blinkar vitt. Samma ordning som tidning.js.
   Sajten och konceptets publikläge: bara kvällsupplagan, ljust som förval, mörkt om ?tema=mork eller det sparade
   valet säger det. Konceptets egen vy: upplagan ur adressen, det sparade valet eller systemet, och ljuset följer den. */
(function () {
  var PUBLIK = true;  /* bygg-publik.py sätter true på sajten */
  var d = document.documentElement, q = null;
  try { q = new URLSearchParams(location.search); } catch (e) {}
  if (PUBLIK || (q && q.get('publik') === '1')) {
    var t = q && q.get('tema');
    if (t !== 'ljus' && t !== 'mork') { try { t = localStorage.getItem('portfoljen.v2.tema'); } catch (e) { t = null; } }
    d.setAttribute('data-upplaga', 'kvall');
    d.setAttribute('data-tema', t === 'mork' ? 'mork' : 'ljus');
    return;
  }
  var u = q && q.get('upplaga');
  if (u !== 'morgon' && u !== 'kvall') { try { u = localStorage.getItem('portfoljen.v2.upplaga'); } catch (e) { u = null; } }
  if (u !== 'morgon' && u !== 'kvall') { try { u = matchMedia('(prefers-color-scheme: dark)').matches ? 'kvall' : 'morgon'; } catch (e) { u = 'morgon'; } }
  d.setAttribute('data-upplaga', u);
  d.setAttribute('data-tema', u === 'kvall' ? 'mork' : 'ljus');
})();
</script>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tidning.css">
<link rel="stylesheet" href="wow.css">
<link rel="stylesheet" href="inlagg.css">
</head>
<body>
<div class="sheet">
  <div class="topbar"><span class="tag" id="tag"></span><div class="ctrls" id="ctrls"></div></div>
  <header class="masthead" aria-label="Tidningshuvud">
    <div class="ear left" id="ear-left"></div>
    <p class="nameplate">Portföljen</p>
    <div class="ear right" id="ear-right"></div>
  </header>
  <div class="rules" aria-hidden="true"></div>
  <section class="strip" id="strip" aria-label="Portföljen i siffror"></section>

  <section class="front" aria-label="Förstasidan">
    <article class="lead">
      <h1 id="headline"></h1>
      <p class="lede" id="lede"></p>
      <div class="byline" id="byline"></div>
      <figure class="graphic" style="margin-left:0;margin-right:0">
        <div class="ghead"><h2 id="g-ex-h"></h2></div>
        <p class="gsub" id="g-ex-sub"></p>
        <div class="chartwrap" id="excess"></div>
        <details class="numbers"><summary id="ex-sum"></summary><table class="t" id="ex-table"></table></details>
      </figure>
    </article>
    <aside class="rail" aria-label="Mot MSCI World">
      <figure class="graphic" style="margin-left:0;margin-right:0">
        <div class="ghead"><h2 id="g-gauge-h"></h2></div>
        <p class="gsub" id="g-gauge-sub"></p>
        <div class="chartwrap" id="gauge"></div>
        <div class="keys" id="gauge-keys"></div>
      </figure>
      <figure class="graphic" style="margin-left:0;margin-right:0">
        <div class="ghead"><h2 id="g-bars-h"></h2></div>
        <div class="chartwrap" id="bars"></div>
        <p class="gauge-note" id="g-bars-note"></p>
      </figure>
    </aside>
  </section>

  <section class="desk" id="desk" aria-label="Positionerna, ordnade efter vikt"></section>

  <section class="lower" aria-label="I korthet, kalendern och marknaderna">
    <section class="brief"><div class="head"><h2 id="brief-h"></h2><div class="lines" id="brief-lines"></div></div></section>
    <section class="calendar"><h2 id="cal-h"></h2><ul class="callist" id="cal"></ul></section>
    <section class="markets"><h2 id="mk-h"></h2><table class="t" id="macro"></table></section>
  </section>

  <section class="listwrap" aria-labelledby="list-h">
    <div class="listhead"><h2 id="list-h"></h2><p id="list-sub"></p></div>
    <table class="list" id="list"></table>
  </section>

  <footer class="foot" id="foot"></footer>
</div>
<noscript><p style="padding:24px 40px">Portföljen behöver JavaScript för att läsa datan i data.js. Portföljen needs JavaScript to read the data in data.js.</p></noscript>
<script src="data.js"></script>
<script src="blogg.js"></script>
<script src="tidning.js"></script>
<script>
(function () {
  'use strict';
  const T = window.Tidning;
  if (!T) { document.querySelector('.sheet').insertAdjacentHTML('afterbegin', '<p style="padding:24px 0">Datan saknas: data.js kunde inte läsas.</p>'); return; }
  T.forsta();
})();
</script>
<script src="inlagg-data.js"></script>
<script src="inlagg.js"></script>
<script src="wow.js"></script>
</body>
</html>
