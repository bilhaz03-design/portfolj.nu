<!doctype html>
<html lang="sv" data-upplaga="morgon" data-tema="ljus">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-yNNZuoKzsgXsuVcPRx/MwLX3IZPMnF91Gwi0AlOd+pw=' 'sha256-4cR6Da5ETjnYftuROiI3VL/cuUccdMUCxvDBPxYOQP8='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Positionen · Portföljen</title>
<meta name="description" content="En position i Portföljen: grafen med optionernas solfjäder, tankarna, senaste händelsen och riktkursen.">
<script>
/* Färgläget sätts före första målningen, så att mörkt läge inte blinkar vitt. Samma ordning som tidning.js.
   Sajten och konceptets publikläge: bara kvällsupplagan, ljust som förval, mörkt om ?tema=mork eller det sparade
   valet säger det. Konceptets egen vy: upplagan ur adressen, det sparade valet eller systemet, och ljuset följer den. */
(function () {
  var PUBLIK = true;  /* bygg-publik.py sätter true på sajten */
  var d = document.documentElement, q = null;
  try { q = new URLSearchParams(location.search); } catch (e) {}
  if (PUBLIK || (q && q.get('publik') === '1')) {
    var t = q && q.get('tema');
    if (t !== 'ljus' && t !== 'mork') { try { t = localStorage.getItem('portfoljen.v2.tema'); } catch (e) { t = null; } }
    d.setAttribute('data-upplaga', 'kvall');
    d.setAttribute('data-tema', t === 'mork' ? 'mork' : 'ljus');
    return;
  }
  var u = q && q.get('upplaga');
  if (u !== 'morgon' && u !== 'kvall') { try { u = localStorage.getItem('portfoljen.v2.upplaga'); } catch (e) { u = null; } }
  if (u !== 'morgon' && u !== 'kvall') { try { u = matchMedia('(prefers-color-scheme: dark)').matches ? 'kvall' : 'morgon'; } catch (e) { u = 'morgon'; } }
  d.setAttribute('data-upplaga', u);
  d.setAttribute('data-tema', u === 'kvall' ? 'mork' : 'ljus');
})();
</script>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tidning.css">
<style>.masthead.small{padding-top:10px}.masthead.small .nameplate{font-size:44px}@media (max-width:760px){.masthead.small .nameplate{font-size:38px}}</style>
</head>
<body>
<div class="sheet">
  <div class="topbar"><span class="tag" id="tag"></span><div class="ctrls" id="ctrls"></div></div>
  <header class="masthead small" aria-label="Tidningshuvud">
    <div class="ear left" id="ear-left"></div>
    <p class="nameplate"><a href="index.html" id="np-link">Portföljen</a></p>
    <div class="ear right" id="ear-right"></div>
  </header>
  <div class="rules" aria-hidden="true"></div>
  <nav class="posnav" id="posnav" aria-label="Positionerna"></nav>

  <article class="article">
    <header class="ahead">
      <p class="kick" id="kick"></p>
      <h1 id="a-h1"></h1>
      <p class="dek" id="a-dek"></p>
      <div class="byline" id="a-byline"></div>
    </header>
    <figure class="bigchart" style="margin-left:0;margin-right:0">
      <div class="legend" id="legend"></div>
      <div class="chartwrap" id="bigchart"></div>
      <p class="caption" id="caption"></p>
      <details class="numbers"><summary id="chart-sum"></summary><table class="t" id="chart-table"></table></details>
    </figure>
    <section class="figs" id="figs" aria-label="Positionen i siffror"></section>
    <section class="twocol" id="twocol">
      <div class="yours"><h2 id="yours-h"></h2><dl id="yours"></dl></div>
      <div class="check"><h2 id="check-h"></h2><ol id="check"></ol></div>
      <div class="tankar" id="tankar" hidden></div>
    </section>
    <section class="lowerpos">
      <div class="plan"><h2 id="plan-h"></h2><div class="plan-body" id="plan-body"></div></div>
      <div class="optbox"><h2 id="opt-h"></h2><div id="opt-body"></div></div>
    </section>
  </article>
  <footer class="foot" id="foot"></footer>
</div>
<noscript><p style="padding:24px 40px">Portföljen behöver JavaScript för att läsa datan i data.js. Portföljen needs JavaScript to read the data in data.js.</p></noscript>
<script src="data.js"></script>
<script src="blogg.js"></script>
<script src="tidning.js"></script>
<script>
(function () {
  'use strict';
  const T = window.Tidning;
  if (!T) { document.querySelector('.sheet').insertAdjacentHTML('afterbegin', '<p style="padding:24px 0">Datan saknas: data.js kunde inte läsas.</p>'); return; }
  T.positionssida();
  window.addEventListener('hashchange', () => T.positionssida());
})();
</script>
</body>
</html>
